[package]
name = "rust-container"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.180"
nix = { version = "0.27.1", features = ["ptrace", "user", "process"] }

[dev-dependencies]
test-binaries = { path = "test-binaries" }

[workspace]
members = [
    ".",
    "test-binaries",
]
default-members = [
    ".",
    "test-binaries",
]
